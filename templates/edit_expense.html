{% extends "base.html" %}

{% block title %}Edit expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/edit-expense.css') }}">
{% endblock %}

{% block content %}

<section class="expense-form-page">
    <div class="expense-form-container">

        <div class="expense-form-header">
            <h1 class="expense-form-title">Edit an expense</h1>
            <p class="expense-form-subtitle">Update a transaction in your ledger</p>
        </div>

        <div class="expense-form-card">
            {% if error %}
            <div class="expense-form-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', id=expense_id) }}">
                <div class="expense-form-row">
                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" name="amount"
                               class="form-input" step="0.01" min="0.01"
                               placeholder="0.00" value="{{ amount_value }}"
                               required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date"
                               class="form-input" value="{{ date_value }}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled {% if not category_value %}selected{% endif %}>Choose a category</option>
                        {% for c in categories %}
                        <option value="{{ c }}" {% if c == category_value %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description <span class="form-optional">(optional)</span></label>
                    <input type="text" id="description" name="description"
                           class="form-input" maxlength="200"
                           placeholder="e.g. Groceries at local market"
                           value="{{ description_value }}">
                </div>

                <div class="expense-form-actions">
                    <button type="submit" class="btn-submit">Save changes</button>
                    <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</section>

{% endblock %}
